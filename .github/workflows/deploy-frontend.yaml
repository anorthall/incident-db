name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests
    uses: ./.github/workflows/frontend-tests.yaml

  deploy:
    name: Build and Deploy SPA
    needs: [frontend-tests]
    if: vars.FRONTEND_BUCKET != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: frontend/cidb
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/cidb/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_TAG_MANAGER_ID: ${{ vars.VITE_TAG_MANAGER_ID }}
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      # Order matters: hashed assets go up before the HTML that references
      # them, and stale assets are pruned only after the invalidation, so a
      # failure at any step leaves a working site.
      - name: Upload hashed assets
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index and root files
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          aws s3 sync dist/ "s3://$BUCKET/" --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/"

      - name: Prune stale assets
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" --delete
