name: Deploy Backend

on:
  push:
    branches:
      - main
    paths-ignore:
      - "frontend/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the current commit)"
        required: false
        type: string

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yaml

  frontend-tests:
    name: Frontend Tests
    uses: ./.github/workflows/frontend-tests.yaml

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yaml

  infra:
    name: Infra Checks
    uses: ./.github/workflows/infra-checks.yaml

  build:
    name: Build and Push Image
    needs: [backend-tests, frontend-tests, lint, infra]
    runs-on: ubuntu-24.04-arm
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Resolve SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [build]
    if: vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Run deploy.sh via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${DEPLOY_SHA:0:7}" \
            --parameters "commands=[\"/opt/cidb/deploy.sh $DEPLOY_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "::group::deploy.sh stdout"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"

          echo "::group::deploy.sh stderr"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "final status: $status"
          [ "$status" = "Success" ]
