name: Lint

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: Ruff
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: ruff check

      - name: Ruff format
        run: ruff format --check --diff
