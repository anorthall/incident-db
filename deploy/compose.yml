name: cidb

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: ghcr.io/anorthall/incident-db:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - path: prod.env
        required: false
    environment:
      PORT: 8000
    logging: *logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8000/core/healthcheck/")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: cidb
      POSTGRES_USER: cidb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/cidb/data/postgres:/var/lib/postgresql
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cidb -d cidb"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - /opt/cidb/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/cidb/data/caddy:/data
    logging: *logging
    depends_on: [web]
