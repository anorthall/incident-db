{% load static %}
{% load django_htmx %}
{% load active_link_tags %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}An online database of caving incidents and analysis.{% endblock %}">

  <title>{% block title %}Caving Incident Database{% endblock %}</title>

  <link href="{% static 'css/tabler.min.css' %}" rel="stylesheet">
  <script src="{% static 'js/tabler.min.js' %}"></script>

  <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Sora%3A500%2C300%2C400%2C700%7CEB+Garamond%3A500&#038;ver=6.5.3" media="all"/>

  <!-- Bootstrap Icons v1.10.3 -->
  <link rel="stylesheet" href="{% static "bootstrap-icons/bootstrap-icons.css" %}">

  <!-- HTMX v1.9.7 JS -->
  <script src="{% static "js/htmx.min.js" %}"></script>
  <script src="{% static "js/htmx-alpine-morph.js" %}"></script>
  {% django_htmx_script %}

  <!-- Alpine 3.13.2 JS -->
  <script defer src="{% static "js/alpine-focus-plugin.min.js" %}"></script>
  <script defer src="{% static "js/alpine-morph-plugin.min.js" %}"></script>
  <script defer src="{% static "js/alpine.min.js" %}"></script>

  <!-- jQuery v3.7.1 -->
  <script src="{% static "js/jquery.min.js" %}"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LVK52HLNKW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-LVK52HLNKW');
  </script>

  {% block header_scripts %}{% endblock %}

</head>

<body>
<div id="blurContainer"></div>

{% include "navbar.html" %}

<main>
  <div id="mainContent" class="{% block main_content_class %}{% endblock %}">
    {% include "messages.html" %}

    {% block content %}{% endblock %}
  </div>
</main>

<footer class="border-top text-light db-navbar-style" id="mainFooter">
  <div class="d-flex justify-content-between align-items-center" id="footerContent">
    <div>
      <!-- Colour mode dropdown -->
      <div class="dropup bd-mode-toggle">
        <button class="btn text-white dropdown-toggle d-flex align-items-center"
                id="bd-theme"
                type="button"
                aria-expanded="false"
                data-bs-toggle="dropdown"
                aria-label="Toggle theme (auto)">
          <svg class="bi my-1 theme-icon-active" style="fill: white;" width="1em" height="1em">
            <use href="#circle-half"></use>
          </svg>
          <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
          <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
              <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em">
                <use href="#sun-fill"></use>
              </svg>
              Light
              <svg class="bi ms-auto d-none" width="1em" height="1em">
                <use href="#check2"></use>
              </svg>
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
              <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em">
                <use href="#moon-stars-fill"></use>
              </svg>
              Dark
              <svg class="bi ms-auto d-none" width="1em" height="1em">
                <use href="#check2"></use>
              </svg>
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto" aria-pressed="true">
              <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em">
                <use href="#circle-half"></use>
              </svg>
              Auto
              <svg class="bi ms-auto d-none" width="1em" height="1em">
                <use href="#check2"></use>
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>

<!-- Clickable elements with data-href -->
<script>
  jQuery(document).ready(function ($) {
    $('*[data-href]').on('click', function () {
      window.location = $(this).data("href");
    });
  });
</script>

<!-- Bootstrap Tooltips -->
<script>
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
  const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
</script>
</body>
</html>
